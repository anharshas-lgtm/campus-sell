name: campus_mart
description: CampusMart - Buy & sell within your campus.
publish_to: 'none'
version: 1.0.8+13


environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # notificaitno
  flutter_local_notifications: ^17.2.2

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Image picker
  image_picker: ^1.1.2

  # URL launcher (WhatsApp + Call)
  url_launcher: ^6.3.0

  # Time formatting
  timeago: ^3.7.0

  # HTTP for Cloudinary upload
  http: ^1.2.0
  flutter_launcher_icons: ^0.14.4
  algolia_helper_flutter: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Add this line for the icon tool:

# The configuration for your app icon
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false # Set to true later if you develop for iOS
  image_path: "assets/icon.png"
  # This ensures the icon looks good on modern Android (8.0+)
  adaptive_icon_background: "#673ab7"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png